<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>사주명식 리포트</title>
<style>
  @font-face {
    font-family: 'Cafe24Danjunghae';
    src: url('fonts/Cafe24Danjunghae.ttf') format('truetype'),
         url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_twelve@1.1/Cafe24Danjunghae.woff') format('woff');
    font-weight: normal;
    font-display: swap;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; }

  /* ---------------------------------------------------------------------
     [2026-10 개편] 이 문서는 "글자 층"이다.
     배경(별·성운·금 액자·모서리 문양·마법진)은 report_assets/art/*.pdf 를 build_report.py 가
     페이지 밑에 깔아 합친다(pypdf). 그래서 아트 모드에서는 body 배경을 칠하지 않는다(PDF가 투명).
     {{BG_CSS}} = 아트 모드: "background:transparent;"  /  기본 모드(합성 불가 시): 예전 검정 줄무늬 배경.

     wkhtmltopdf(구형 WebKit) 실측 지원표 (0.12.6 patched qt):
       O  -webkit-gradient(...) / -webkit-linear-gradient / -webkit-radial-gradient
       O  border-image(9분할), PNG 알파, rgba(), box-shadow·text-shadow 글로우, 인라인 SVG(다각형·그라데이션)
       X  표준 linear-gradient(), CSS 변수 var(), SVG blur 필터, ✦ ❖ ☰ 같은 특수 기호(글꼴에 없음)
     ------------------------------------------------------------------- */
  body {
    font-family: 'Cafe24Danjunghae', 'Noto Sans CJK KR', sans-serif;
    {{BG_CSS}}
    color: #F3EDE0;
    /* 좌우 여백은 wkhtmltopdf 여백(0)이 아니라 padding으로 준다(풀블리드). */
    padding-left: 82px;      /* CSS 1px = 0.6pt 이므로 약 17.4mm(물리): 액자 안쪽선에서 충분히 띄운다 */
    padding-right: 82px;
    /* 한글 어절 단위 줄바꿈(keep-all은 엔진이 무시하므로 build_report._keep_words 가 nowrap 처리) */
    word-break: keep-all;
    overflow-wrap: break-word;
  }

  .section-break { page-break-before: always; }

  /* ---------- 장 머리: 메달 + 영문 라벨 + 제목 + 부제 + 구분선 ---------- */
  .chapter-head { page-break-inside: avoid; page-break-after: avoid; text-align: center; }
  .chapter-medal { position: relative; width: 44mm; height: 44mm; margin: 0 auto 7mm auto; }
  .chapter-medal img { position: absolute; left: 0; top: 0; width: 44mm; height: 44mm; }
  .chapter-medal .num { position: absolute; left: 0; top: 0; width: 44mm; height: 44mm; line-height: 44mm; text-align: center;
    font-family: 'Noto Serif CJK KR', serif; font-weight: 700; color: #F6DC8A; text-shadow: 0 0 14px #D4AA3A; }
  .num-1 { font-size: 104px; }
  .num-2 { font-size: 70px; }
  .num-3 { font-size: 50px; }
  .chapter-eyebrow { font-size: 33px; letter-spacing: 0.36em; padding-left: 0.36em; color: #C9C0AC; margin-bottom: 20px; }
  .chapter-title { font-family: 'Noto Serif CJK KR', serif; font-size: 108px; font-weight: 700; color: #F8F1DE; line-height: 1.2; margin-bottom: 14px; text-shadow: 0 0 22px rgba(154,125,255,0.55); }
  .chapter-title-sub { font-size: 46px; color: #EBC35A; margin-bottom: 26px; }
  .orn-divider { display: block; width: 100%; margin: 0 0 9mm 0; }
  /* 삽화: 9분할 액자(border-image) 안에 그림 + 말풍선 */
  .illust { position: relative; width: 100%; margin: 0 0 10mm 0; border: 8mm solid transparent; -webkit-border-image: url('orn/frame.png') 84 84 84 84 stretch; border-image: url('orn/frame.png') 84 84 84 84 stretch;
    background: #0B0714; page-break-inside: avoid; }
  .illust img { display: block; width: 100%; }
  .bubble { position: absolute; right: 4%; bottom: 7%; width: 48%; padding: 20px 26px; background: rgba(11,7,20,0.88); border: 2px solid #EBC35A; border-radius: 30px; box-shadow: 0 0 18px 0 rgba(235,195,90,0.45); color: #F8F1DE; font-size: 30px; line-height: 1.4; text-align: center; }
  .illust-mid { margin: 40px 0; }
  .body-text { font-size: 32px; line-height: 1.55; color: #E9E3D4; text-align: left; }
  .body-text p { margin-bottom: 28px; }

  /* ---------- 사주 원국 명패 (표 레이아웃: 구형 엔진에서 균등 4등분) ---------- */
  .myeongsik { display: table; width: 100%; table-layout: fixed; margin: 16px 0 44px 0; page-break-inside: avoid; }
  .myeongsik-cell { display: table-cell; padding: 0 7px; }
  .myeongsik-cell:first-child { padding-left: 0; }
  .myeongsik-cell:last-child { padding-right: 0; }
  .pillar-card {
    background: #150E27;
    background: -webkit-gradient(linear, left top, left bottom, from(#241848), to(#0E0A1C));
    border: 4px double #D4AA3A;
    border-radius: 8px;
    box-shadow: 0 0 22px 0 rgba(212,170,58,0.34), inset 0 0 20px 0 rgba(154,125,255,0.22);
    padding: 20px 8px 18px 8px;
    text-align: center;
  }
  .pillar-label { font-size: 33px; color: #EBC35A; letter-spacing: 0.14em; margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid rgba(212,170,58,0.5); }
  .pillar-char { font-family: 'Noto Serif CJK KR', serif; font-size: 118px; font-weight: 700; line-height: 1.22; text-shadow: 0 0 16px rgba(255,255,255,0.18); }
  .pillar-hanja { font-size: 34px; color: #C9C0AC; margin-top: 10px; }
  /* 오행 글자색 (어두운 보랏빛 바탕에서 또렷하도록 조금 밝게) */
  .oheng-목 { color: #5FC27A; }
  .oheng-화 { color: #FF6B55; }
  .oheng-토 { color: #F0C84C; }
  .oheng-금 { color: #ECE8DC; }
  .oheng-수 { color: #5A9EF0; }

  /* ---------- 오행 분포: 레이더 + 막대 ---------- */
  .oheng-block { margin-top: 12mm; page-break-inside: avoid; }
  .oheng-radar { text-align: center; margin: 1mm 0 3mm 0; page-break-inside: avoid; }
  .oheng-panel {
    background: #150E27;
    background: -webkit-gradient(linear, left top, left bottom, from(#1F1540), to(#0D091B));
    border: 4px double #D4AA3A;
    border-radius: 10px;
    box-shadow: 0 0 26px 0 rgba(212,170,58,0.28), inset 0 0 22px 0 rgba(154,125,255,0.16);
    padding: 26px 30px 6px 30px;
    margin: 12px 0 30px 0;
    page-break-inside: avoid;
  }
  .oheng-row { display: table; width: 100%; table-layout: fixed; margin-bottom: 18px; }
  .oheng-name { display: table-cell; width: 150px; font-size: 40px; color: #F3EDE0; vertical-align: middle; }
  .oheng-badge { display: inline-block; width: 56px; height: 56px; line-height: 52px; border: 2px solid; border-radius: 50%; text-align: center;
    font-family: 'Noto Serif CJK KR', serif; font-size: 30px; font-weight: 700; background: rgba(0,0,0,0.3); vertical-align: middle; }
  .oheng-name-kr { display: inline-block; vertical-align: middle; margin-left: 14px; }
  .oheng-track-cell { display: table-cell; vertical-align: middle; padding: 0 20px; }
  .oheng-track { height: 28px; background: rgba(243,237,224,0.09); border: 1px solid rgba(243,237,224,0.14); border-radius: 14px; overflow: hidden; }
  .oheng-fill { height: 100%; border-radius: 14px; }
  .oheng-count { display: table-cell; width: 130px; font-size: 36px; color: #C9C0AC; text-align: right; vertical-align: middle; white-space: nowrap; }
  .oheng-pct { display: inline-block; margin-left: 10px; font-size: 24px; color: #8C8676; }

  /* ---------- 대운 타임라인 ---------- */
  .daeun-timeline { display: table; width: 100%; table-layout: fixed; margin: 46px 0; border-top: 2px solid #D4AA3A; padding-top: 36px; page-break-inside: avoid; }
  .daeun-step { display: table-cell; text-align: center; position: relative; padding: 8px 4px; }
  .daeun-step::before { content: ""; position: absolute; top: -33px; left: 50%; margin-left: -8px; width: 14px; height: 14px; border-radius: 50%; background: #EBC35A; box-shadow: 0 0 12px 2px rgba(235,195,90,0.7); }
  .daeun-age { font-size: 34px; color: #C9C0AC; margin-bottom: 12px; }
  .daeun-gz { font-family: 'Noto Serif CJK KR', serif; font-size: 56px; font-weight: 700; }

  /* 콜아웃: 액자 + 어두운 바탕 */
  .callout { border: 8mm solid transparent; -webkit-border-image: url('orn/frame.png') 84 84 84 84 stretch; border-image: url('orn/frame.png') 84 84 84 84 stretch;
    background: #120C22; background: -webkit-gradient(linear, left top, left bottom, from(#1D1438), to(#0E0A1B));
    font-size: 40px; color: #D9D1BC; line-height: 1.55; width: 100%; margin-top: 32px; text-align: center; page-break-inside: avoid; }

  /* 맺음 덩어리: 마지막 문단 몇 개 + 콜아웃을 쪽 가운데서 끊지 않는다(콜아웃 상자만 다음 쪽에 덩그러니 남는 것 방지) */
  .keep-tail { page-break-inside: avoid; }

  /* ---------- 목차 ---------- */
  .toc-head { text-align: center; }
  .toc-item { display: table; width: 100%; table-layout: fixed; padding: 26px 0; border-bottom: 1px solid rgba(212,170,58,0.4); page-break-inside: avoid; }
  .toc-mark { display: table-cell; font-family: 'Noto Serif CJK KR', serif; color: #EBC35A; font-size: 60px; width: 130px; vertical-align: baseline; text-shadow: 0 0 12px rgba(212,170,58,0.6); }
  .toc-name { display: table-cell; font-size: 54px; color: #F3EDE0; vertical-align: baseline; }
  .toc-page { display: table-cell; font-size: 42px; color: #C9C0AC; width: 150px; text-align: right; white-space: nowrap; vertical-align: baseline; }

  .end-orn { margin: 16mm 0 0 0; text-align: center; page-break-inside: avoid; }
  .end-orn img { display: block; width: 100%; margin-bottom: 4mm; }
  .end-orn div { font-size: 28px; letter-spacing: 0.5em; padding-left: 0.5em; color: #C9C0AC; }

  .watermark { position: relative; height: 0; }
  .watermark-mark { position: absolute; top: 260px; left: 38%; transform: translate(-50%,0) rotate(-30deg); font-size: 42px; font-weight: 900; color: rgba(212,175,90,0.18); letter-spacing: 2px; white-space: nowrap; z-index: 999; pointer-events: none; }

  /* 목차 페이지번호 계산용 숨김 마커: 실제 텍스트로 렌더링돼야 pdftotext가 찾는다(1% 투명도로 눈에는 안 보임) */
  .pagemark { position: absolute; color: rgba(255,255,255,0.012); font-size: 8px; line-height: 1; }
</style>
</head>
<body>
{{BODY_PAGES}}
</body>
</html>
