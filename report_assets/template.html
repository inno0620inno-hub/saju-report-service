<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>사주명식 리포트</title>
<style>
  @page { margin: 0; size: A4; }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { width: 100%; }

  :root {
    --ink: #16140F;
    --ink-soft: #201D17;
    --paper: #F3EDE0;
    --paper-dim: #C9C0AC;
    --gold: #B8923F;
    --gold-bright: #D4AF5A;

    /* 오방색 (오행별 색상) */
    --wood:  #4C7A52;  /* 목 */
    --fire:  #B03A2E;  /* 화 */
    --earth: #C9A227;  /* 토 */
    --metal: #C9C4B4;  /* 금 */
    --water: #3A5A8C;  /* 수 */
  }

  body {
    font-family: 'Noto Sans CJK KR', sans-serif;
    background: #16140F;
    color: #F3EDE0;
  }

  .page {
    width: 100%;
    min-height: 297mm;
    padding: 22mm 20mm;
    position: relative;
    page-break-after: always;
  }
  .page:last-child { page-break-after: auto; }
  .page.cover { height: 297mm; overflow: hidden; }
  .page-inner {
    width: 100%;
  }

  /* ---------- 표지 ---------- */
  .cover {
    background:
      radial-gradient(circle at 50% 18%, rgba(212,175,90,0.18), transparent 45%),
      #16140F;
    display: table;
  }
  .cover .page-inner {
    display: table-cell;
    vertical-align: middle;
    text-align: center;
  }
  .cover .eyebrow {
    letter-spacing: 0.5em;
    font-size: 11px;
    color: #B8923F;
    margin-bottom: 28px;
  }
  .cover .hanja-big {
    font-family: 'Noto Serif CJK KR', serif;
    font-size: 92px;
    font-weight: 700;
    color: #F3EDE0;
    line-height: 1.05;
    margin-bottom: 6px;
  }
  .cover .title-kr {
    font-family: 'Noto Serif CJK KR', serif;
    font-size: 30px;
    font-weight: 600;
    color: #D4AF5A;
    margin-bottom: 40px;
  }
  .cover .divider {
    width: 60px; height: 1px; background: #B8923F;
    margin: 0 auto 40px auto;
  }
  .cover .subject-name {
    font-size: 22px;
    color: #F3EDE0;
    margin-bottom: 8px;
    font-weight: 700;
  }
  .cover .subject-meta {
    font-size: 13px;
    color: #C9C0AC;
    letter-spacing: 0.05em;
  }
  .cover .footer-mark {
    position: absolute;
    bottom: 90px;
    font-size: 10px;
    color: #C9C0AC;
    letter-spacing: 0.3em;
  }

  /* ---------- 공통 섹션 헤더 ---------- */
  .chapter-mark {
    font-family: 'Noto Serif CJK KR', serif;
    font-size: 44px;
    color: #B8923F;
    line-height: 1;
    margin-bottom: 6px;
  }
  .chapter-eyebrow {
    font-size: 11px;
    letter-spacing: 0.35em;
    color: #C9C0AC;
    margin-bottom: 18px;
  }
  .chapter-title {
    font-family: 'Noto Serif CJK KR', serif;
    font-size: 32px;
    font-weight: 700;
    color: #F3EDE0;
    margin-bottom: 6px;
  }
  .chapter-title-sub {
    font-size: 14px;
    color: #D4AF5A;
    margin-bottom: 28px;
  }
  .rule {
    height: 1px;
    background: linear-gradient(90deg, #B8923F, transparent);
    margin-bottom: 26px;
  }
  .body-text {
    font-size: 13.50px;
    line-height: 2.05;
    color: #E7E1D2;
    text-align: justify;
  }
  .body-text p { margin-bottom: 16px; }

  .page-num {
    position: absolute;
    bottom: 53px; right: 76px;
    font-size: 10px;
    color: #C9C0AC;
    letter-spacing: 0.2em;
  }

  /* ---------- 사주 원국 명패(시그니처) ---------- */
  .myeongsik {
    display: flex;
    gap: 10px;
    margin: 10px 0 30px 0;
  }
  .pillar-card {
    flex: 1;
    background: #201D17;
    border: 1px solid rgba(184,146,63,0.35);
    border-radius: 2px;
    padding: 14px 8px;
    text-align: center;
  }
  .pillar-label {
    font-size: 10px;
    color: #C9C0AC;
    letter-spacing: 0.2em;
    margin-bottom: 10px;
  }
  .pillar-char {
    font-family: 'Noto Serif CJK KR', serif;
    font-size: 30px;
    font-weight: 700;
    line-height: 1.5;
  }
  .pillar-hanja {
    font-size: 11px;
    color: #C9C0AC;
    margin-top: 4px;
  }
  .oheng-목 { color: #4C7A52; }
  .oheng-화 { color: #B03A2E; }
  .oheng-토 { color: #C9A227; }
  .oheng-금 { color: #C9C4B4; }
  .oheng-수 { color: #3A5A8C; }

  /* ---------- 오행 분포 바 ---------- */
  .oheng-bars { margin: 24px 0 34px 0; }
  .oheng-row { display: flex; align-items: center; gap: 12px; margin-bottom: 9px; }
  .oheng-name { width: 34px; font-size: 13px; color: #F3EDE0; }
  .oheng-track { flex: 1; height: 8px; background: #201D17; border-radius: 4px; overflow: hidden; }
  .oheng-fill { height: 100%; border-radius: 4px; }
  .oheng-count { width: 20px; font-size: 12px; color: #C9C0AC; text-align: right; }

  /* ---------- 대운 타임라인 ---------- */
  .daeun-timeline {
    display: flex;
    margin: 28px 0;
    border-top: 1px solid rgba(184,146,63,0.3);
    padding-top: 20px;
  }
  .daeun-step { flex: 1; text-align: center; position: relative; padding: 0 4px; }
  .daeun-step::before {
    content: "";
    position: absolute; top: -21px; left: 50%; transform: translateX(-50%);
    width: 7px; height: 7px; border-radius: 50%;
    background: #B8923F;
  }
  .daeun-age { font-size: 10px; color: #C9C0AC; margin-bottom: 6px; }
  .daeun-gz { font-family: 'Noto Serif CJK KR', serif; font-size: 16px; font-weight: 700; }

  .callout {
    background: #201D17;
    border-left: 3px solid #B8923F;
    padding: 14px 18px;
    font-size: 12.50px;
    color: #C9C0AC;
    line-height: 1.8;
    margin-top: 20px;
  }

  /* ---------- 목차 ---------- */
  .toc-item {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 14px 0;
    border-bottom: 1px solid rgba(184,146,63,0.2);
  }
  .toc-mark { font-family: 'Noto Serif CJK KR', serif; color: #B8923F; font-size: 18px; width: 40px; }
  .toc-name { flex: 1; font-size: 15px; color: #F3EDE0; }
  .toc-page { font-size: 12px; color: #C9C0AC; }
</style>
</head>
<body>

<!-- ============ 표지 ============ -->
<div class="page cover">
<div class="page-inner">

  <div class="eyebrow">사 주 명 식 해 설</div>
  <div class="hanja-big">命</div>
  <div class="title-kr">사주 명식 리포트</div>
  <div class="divider"></div>
  <div class="subject-name">{{NAME}}</div>
  <div class="subject-meta">{{BIRTH_INFO}}</div>
  <div class="footer-mark">SAJU REPORT · {{ISSUE_DATE}}</div>

</div>
</div>
<!-- ============ 이하 목차 + 원국 + 섹션들은 build_report.py가 상품 구성에 맞춰 동적으로 생성해서 여기에 삽입 ============ -->
{{BODY_PAGES}}

</body>
</html>
