<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; width: 100%; }
  body { font-family: 'Noto Sans CJK KR', sans-serif; {{BG_CSS}} }
  /* 기본 모드: 예전처럼 오른쪽 아래 작은 번호 */
  .legacy .page-num { text-align: right; padding-right: 16mm; font-size: 16px; color: #C9C0AC; letter-spacing: 0.2em; padding-top: 6mm; }
  /* 아트 모드: 배경 아트의 하단 중앙 타원(쪽번호 자리) 안에 가운데 정렬 */
  .art .page-num { text-align: center; font-size: 19px; color: #F3DE9A; letter-spacing: 0.16em; padding-left: 0.16em; padding-top: {{NUM_TOP}}; }
</style>
<script>
function subst() {
  var vars = {};
  var x = document.location.search.substring(1).split('&');
  for (var i in x) {
    if (!x[i]) continue;
    var z = x[i].split('=', 2);
    vars[z[0]] = decodeURIComponent(z[1] || '');
  }
  var page = parseInt(vars['page'], 10);
  var padded = (page < 10 ? '00' : (page < 100 ? '0' : '')) + page;
  var els = document.getElementsByClassName('page');
  for (var j = 0; j < els.length; ++j) { els[j].textContent = padded; }
}
</script>
</head>
<body class="{{MODE}}" onload="subst()">
  <div class="page-num"><span class="page"></span></div>
</body>
</html>
