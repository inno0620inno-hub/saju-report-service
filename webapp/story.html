<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>금빛도사 · 금빛 사주명식</title>
<meta name="description" content="금빛도사가 태어난 순간의 여덟 글자를 펼쳐 당신의 운명을 짚어 드립니다.">
<meta property="og:title" content="금빛도사 · 금빛 사주명식">
<meta property="og:description" content="질문 몇 개면 충분합니다. 금빛도사가 의표를 찌르는 풀이를 준비합니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0a0907; --ink2: #14110c; --gold: #d4af5a; --gold-soft: #f1dca0; --gold-dim: #8a7338;
    --paper: #efe6cf; --line: rgba(212,175,90,.35); --glass: rgba(20,17,12,.72);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #000; color: var(--paper); font-family: 'Noto Sans KR', sans-serif; }
  #app { position: relative; width: 100%; max-width: 480px; height: 100dvh; margin: 0 auto; overflow: hidden; background: var(--ink); }

  /* 배경: 도사 일러스트(assets/dosa.jpg)가 있으면 사용, 없으면 금빛 그라데이션 */
  .bg { position: absolute; inset: 0; background:
        radial-gradient(120% 70% at 50% 18%, rgba(212,175,90,.28), transparent 60%),
        radial-gradient(80% 50% at 50% 100%, rgba(90,60,20,.55), transparent 70%),
        linear-gradient(#17120a, #060504);
      transition: filter .6s ease, opacity .6s ease; }
  .bg img { width: 100%; height: 100%; object-fit: cover; object-position: center top; opacity: .9; }
  .bg.blur { filter: blur(9px) brightness(.8) saturate(1.1); }
  .bg.soft { filter: blur(3px) brightness(.72) saturate(1.05); }
  .bg.dim { filter: brightness(.6) saturate(1.1); }
  .bg img { transition: opacity .45s ease; }
  .wt .pic.im { background-image: none; }
  .wt .pic.im img { display: block; width: 100%; height: auto; }
  .vignette { position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(to bottom, rgba(0,0,0,.55) 0%, transparent 22%, transparent 45%, rgba(0,0,0,.88) 100%); }
  .seal { position: absolute; top: 14%; left: 50%; transform: translateX(-50%); font-family: 'Noto Serif KR', serif;
      font-size: 120px; line-height: 1; color: var(--gold); text-shadow: 0 0 40px rgba(212,175,90,.55); opacity: .9; }
  .seal.hide { display: none; }

  .back { position: absolute; top: 14px; left: 14px; z-index: 5; width: 36px; height: 36px; border: 0; background: none;
      color: var(--gold-soft); font-size: 22px; cursor: pointer; }
  .progress { position: absolute; top: 0; left: 0; height: 3px; background: linear-gradient(90deg, var(--gold-dim), var(--gold)); z-index: 6; transition: width .4s; }

  .stage { position: absolute; left: 0; right: 0; bottom: 0; padding: 70px 22px calc(28px + env(safe-area-inset-bottom)); z-index: 4;
      background: linear-gradient(to top, rgba(4,3,2,.94) 0%, rgba(4,3,2,.88) 55%, transparent 100%); }
  .eyebrow { font-family: 'Noto Serif KR', serif; font-size: 13px; letter-spacing: .08em; color: var(--gold-soft); opacity: .85; margin-bottom: 8px; min-height: 18px; }
  .line { font-family: 'Noto Serif KR', serif; font-size: 22px; line-height: 1.55; font-weight: 600; color: #fff7e0; margin-bottom: 18px; word-break: keep-all; text-shadow: 0 2px 12px rgba(0,0,0,.7); }
  .line small { display: block; font-size: 13px; font-weight: 400; color: var(--gold-soft); opacity: .8; margin-top: 8px; line-height: 1.5; }

  .btn, .opt { display: block; width: 100%; text-align: center; padding: 15px 16px; margin-top: 10px; border-radius: 14px; cursor: pointer;
      border: 1px solid var(--line); background: var(--glass); color: var(--paper); font-size: 15px; font-family: inherit;
      backdrop-filter: blur(6px); transition: transform .1s, background .2s, border-color .2s; }
  .btn:active, .opt:active { transform: scale(.98); }
  .btn.primary { background: linear-gradient(180deg, #e2bf6a, #b88f33); color: #1a1405; font-weight: 700; border-color: #e8c97c; }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--gold-soft); opacity: .8; font-size: 13px; padding: 10px; }
  .opt.sel { border-color: var(--gold); background: rgba(212,175,90,.2); }
  .row { display: flex; gap: 10px; }
  .row .btn, .row .opt { margin-top: 10px; }

  .field { display: flex; gap: 10px; align-items: center; margin-top: 6px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
  .field input, .field textarea { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: #fff; font-size: 20px; padding: 10px 2px; font-family: inherit; }
  .field input::placeholder, .field textarea::placeholder { color: rgba(239,230,207,.35); }
  .field textarea { font-size: 16px; resize: none; height: 84px; }
  .chip { flex: none; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--gold-soft); font-size: 13px; cursor: pointer; font-family: inherit; }
  .chip.on { background: var(--gold); color: #1a1405; border-color: var(--gold); font-weight: 700; }
  .ok { flex: none; padding: 10px 18px; border-radius: 999px; border: 0; font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer;
      background: rgba(255,255,255,.12); color: rgba(255,255,255,.4); transition: .2s; }
  .ok.on { background: var(--gold); color: #1a1405; }
  .err { color: #ff9c8a; font-size: 13px; margin-top: 8px; min-height: 18px; }

  .cards { max-height: 46dvh; overflow-y: auto; margin-top: 6px; }
  .card { padding: 14px 16px; margin-top: 10px; border-radius: 14px; border: 1px solid var(--line); background: var(--glass); cursor: pointer; }
  .card.sel { border-color: var(--gold); background: rgba(212,175,90,.18); }
  .card .n { font-family: 'Noto Serif KR', serif; font-size: 16px; font-weight: 700; color: #fff7e0; }
  .card .d { font-size: 12.5px; opacity: .75; margin-top: 4px; line-height: 1.45; }
  .card .p { font-size: 15px; color: var(--gold); margin-top: 8px; font-weight: 600; }
  .card.compact { padding: 11px 14px; }
  .card.compact .top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .card.compact .n { font-size: 14.5px; }
  .card.compact .p { margin-top: 0; font-size: 14px; }
  .card.compact .d { margin-top: 3px; font-size: 12px; }

  .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px; z-index: 4; }
  .center .hanja { font-family: 'Noto Serif KR', serif; font-size: 54px; color: var(--gold); letter-spacing: .12em; text-shadow: 0 0 30px rgba(212,175,90,.5); }
  .center .t { font-family: 'Noto Serif KR', serif; font-size: 20px; margin-top: 18px; line-height: 1.6; color: #fff7e0; }
  .center .s { font-size: 13px; opacity: .6; margin-top: 12px; }
  .pulse { animation: pulse 2.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  .loader { width: 160px; height: 2px; background: rgba(255,255,255,.12); margin-top: 28px; overflow: hidden; border-radius: 2px; }
  .loader i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--gold-dim), var(--gold)); }
  .fade { animation: fade .5s ease both; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .pay { position: absolute; inset: 0; overflow-y: auto; padding: 56px 22px 40px; z-index: 4; background: rgba(6,5,4,.86); }
  .pay h2 { font-family: 'Noto Serif KR', serif; font-size: 22px; color: #fff7e0; line-height: 1.5; margin-bottom: 14px; }
  .box { border: 1px solid var(--line); border-radius: 14px; padding: 16px; background: var(--glass); margin-top: 12px; font-size: 14px; line-height: 1.7; }
  .box b { color: var(--gold-soft); }

  /* ===== 웹툰형 세로 스크롤 (로딩 후, 입금 전) ===== */
  .wt { position: absolute; inset: 0; overflow-y: auto; z-index: 4; background: #050403; scroll-behavior: smooth; padding-bottom: 120px; }
  .wt::-webkit-scrollbar { width: 0; }
  .wt .blk { padding: 54px 28px; text-align: center; opacity: 0; transform: translateY(26px); transition: opacity .8s ease, transform .8s ease; }
  .wt .blk.in { opacity: 1; transform: none; }
  .wt .big { font-family: 'Noto Serif KR', serif; font-size: 26px; line-height: 1.6; color: #fff7e0; font-weight: 700; word-break: keep-all; }
  .wt .mid { font-family: 'Noto Serif KR', serif; font-size: 20px; line-height: 1.75; color: #f4ead0; word-break: keep-all; }
  .wt .gold { color: var(--gold); }
  .wt .red { color: #ff7a5c; }
  .wt .sm { font-size: 13px; opacity: .6; margin-top: 14px; line-height: 1.6; }
  .wt .pic { position: relative; width: 100%; background-image: url(assets/dosa.jpg); background-repeat: no-repeat; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .wt .pic::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, #050403 0%, transparent 18%, transparent 70%, #050403 100%); }
  .wt .bub { position: absolute; z-index: 2; background: rgba(240,230,205,.94); color: #1a1405; font-family: 'Noto Serif KR', serif; font-weight: 700; font-size: 15px;
      padding: 14px 18px; border-radius: 999px; line-height: 1.45; box-shadow: 0 6px 24px rgba(0,0,0,.5); }
  .wt .scroll-hint { text-align: center; padding: 22px; font-size: 12px; letter-spacing: .2em; color: var(--gold-soft); opacity: .7; animation: pulse 2.2s infinite; }
  .wt .frame { margin: 0 24px; padding: 30px 24px; border: 1px solid var(--gold-dim); border-radius: 6px; position: relative;
      background: linear-gradient(180deg, rgba(212,175,90,.10), rgba(212,175,90,.03)); text-align: left; }
  .wt .frame::before { content: ''; position: absolute; inset: 6px; border: 1px solid var(--line); border-radius: 3px; pointer-events: none; }
  .wt .frame h3 { font-family: 'Noto Serif KR', serif; color: var(--gold); font-size: 17px; margin-bottom: 14px; text-align: center; }
  .wt .frame p { font-size: 15px; line-height: 1.85; color: #efe6cf; margin-bottom: 10px; word-break: keep-all; }
  .wt .list { text-align: left; padding: 0 28px; }
  .wt .list li { list-style: none; padding: 13px 0 13px 28px; position: relative; border-bottom: 1px solid rgba(212,175,90,.18); font-size: 14.5px; line-height: 1.6; }
  .wt .list li::before { content: '金'; position: absolute; left: 0; top: 13px; color: var(--gold); font-family: 'Noto Serif KR', serif; font-size: 15px; }

  /* ===== 화려한 금빛 CTA (사주보기 버튼) ===== */
  .btn.royal { position: relative; overflow: hidden; padding: 19px 26px; border: 1px solid #fbeab0; border-radius: 6px; letter-spacing: .1em;
      font-family: 'Noto Serif KR', serif; font-size: 18px; font-weight: 700; color: #2a1d05; text-shadow: 0 1px 0 rgba(255,255,255,.45);
      background: linear-gradient(180deg, #f9e5a0 0%, #e0b955 38%, #b98a2e 72%, #d9b04e 100%);
      box-shadow: 0 0 0 3px #120e06, 0 0 0 4px #d4af5a, 0 0 0 7px #120e06, 0 0 0 8px rgba(212,175,90,.5),
                  0 0 38px rgba(212,175,90,.55), inset 0 1px 0 rgba(255,255,255,.7), inset 0 -3px 8px rgba(90,55,5,.45);
      animation: royalGlow 2.6s ease-in-out infinite; }
  .btn.royal::before { content: ''; position: absolute; inset: 5px; border: 1px solid rgba(80,50,5,.5); border-radius: 3px; pointer-events: none; }
  .btn.royal::after { content: ''; position: absolute; top: 0; bottom: 0; width: 38%; left: -60%;
      background: linear-gradient(105deg, transparent, rgba(255,255,255,.65), transparent); transform: skewX(-18deg); animation: royalShine 3.2s ease-in-out infinite; }
  .btn.royal .orn { display: inline-block; margin: 0 10px; font-size: 14px; opacity: .85; }
  .btn.royal small { display: block; font-family: 'Noto Sans KR', sans-serif; font-size: 11px; font-weight: 500; letter-spacing: .2em; margin-top: 3px; opacity: .7; }
  @keyframes royalShine { 0% { left: -60%; } 55%, 100% { left: 130%; } }
  @keyframes royalGlow { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.12); } }
  .cta-fixed { position: absolute; left: 0; right: 0; bottom: 0; z-index: 8; padding: 14px 20px calc(18px + env(safe-area-inset-bottom));
      background: linear-gradient(to top, rgba(5,4,3,.97) 60%, transparent); }
  .cta-fixed .btn { margin: 0; }
  .cta-fixed { padding-top: 26px; }
  .disclaimer { font-size: 11px; opacity: .5; margin-top: 18px; line-height: 1.6; }
</style>
</head>
<body>
<div id="app">
  <div class="progress" id="progress" style="width:0"></div>
  <div class="bg" id="bg"><img id="bgimg" alt="" onerror="this.remove()"></div>
  <div class="seal" id="seal">金</div>
  <div class="vignette"></div>
  <button class="back" id="back" aria-label="뒤로" hidden>‹</button>
  <div id="view"></div>
</div>

<script>
/* ===== 설정 ===== */
const PROD_API = 'https://saju-report-service-production.up.railway.app';   // 기존 신청폼(index.html)과 동일한 서버
const SAME_ORIGIN = ['localhost', '127.0.0.1'].includes(location.hostname) || location.hostname.endsWith('railway.app');
const API_BASE = window.STORY_API_BASE !== undefined ? window.STORY_API_BASE : (SAME_ORIGIN ? '' : PROD_API);
const CHARACTER_IMG = 'assets/dosa.jpg';                 // 금빛도사 일러스트가 준비되면 여기에 저장
const BANK = { bank: '토스뱅크', no: '1001-5571-3435', holder: '하♥진' }; // 기존 신청폼과 동일
const KAKAO_NOTE = '궁금한 점은 카카오톡 채널로 편하게 문의해 주세요.';

const FALLBACK_PRODUCTS = [
  { id: 'full', name: '종합 사주 리포트', price: 19900, description: '총론부터 대운·재물·애정·건강까지 한번에' },
  { id: 'premium', name: '프리미엄 심층 리포트', price: 39900, description: '십신·오행 심층분석 + 향후 5년 흐름까지 총망라' },
];

/* ===== 상태 ===== */
const S = { name:'', phone:'', email:'', birth_date:'', birth_time:'', time_unknown:false, gender:'', product_id:'full',
            delivery_mode:'immediate', schedule_date:'', schedule_time:'',
            who:'', love:'', job:'', concern:'', is_lunar:false, is_leap_month:false };
let products = FALLBACK_PRODUCTS, productsLoaded = false;
let idx = 0; const history = []; let HAS_IMG = false;

/* ===== 질문 흐름 (문구는 금빛도사 말투: 존댓말 + 의표를 찌르는 직설) ===== */
const STEPS = [
  { type:'intro' },
  { type:'choice', bg:'assets/study_door_1.jpg', seal:false, eyebrow:'고요한 서재, 금빛 향이 피어오릅니다', line:'발걸음이 멈춘 이유를,<br>저는 알고 있습니다.', opts:['…누구신가요?','여기가 어디죠?'] },
  { type:'choice', seal:false, eyebrow:'금빛도사', line:'사주를 보러 오신 게 아니지요.<br>이미 정해 둔 답을 확인받으러 오셨습니다.', opts:['…뜨끔하네요','아닌데요?'] },
  { type:'radio', key:'who', blur:true, line:'누구의 운명을<br>펼쳐 볼까요?', opts:['본인','가족','연인','친구','기타'] },
  { type:'date', key:'birth_date', blur:true, line:'태어난 날을 알려 주십시오.', sub:'음력 생일이시면 아래에서 음력을 선택해 주세요.' },
  { type:'time', blur:true, line:'태어난 시간은요?', sub:'모르셔도 괜찮습니다. 모른다는 것 또한 하나의 단서입니다.' },
  { type:'gender', key:'gender', blur:true, line:'성별은 어떻게 되십니까?' },
  { type:'text', key:'name', blur:true, line:'성함을 적어 주십시오.', sub:'이름에도 기운이 있는 법입니다. 입금자명과 같게 적어 주시면 확인이 빠릅니다.', ph:'홍길동', max:20 },
  { type:'radio', key:'love', blur:'soft', bg:'assets/writing_2.jpg', eyebrow:'그렇다면', line:'연애는 쉬고 계십니까,<br>쉬는 척하고 계십니까?', opts:['솔로입니다','고민되는 사람이 있습니다','연애 중입니다','헤어진 지 얼마 안 됐습니다','결혼했습니다'] },
  { type:'radio', key:'job', blur:'soft', bg:'assets/writing_2.jpg', eyebrow:'하나만 더', line:'지금 하는 일, 마음에 드십니까?<br>대답이 늦으시다면 그것이 답입니다.', opts:['학생입니다','일을 구하고 있습니다','직장에 다닙니다','사업을 합니다','프리랜서입니다','쉬고 있습니다'] },
  { type:'concern', key:'concern', blur:'soft', bg:'assets/writing_2.jpg', line:'저에게만 털어놓고 싶은<br>고민이 있으십니까?' },
  { type:'email', key:'email', blur:'soft', bg:'assets/writing_2.jpg', line:'마지막입니다.<br>풀이를 받으실 이메일을 알려 주십시오.', ph:'example@gmail.com' },
  { type:'loading' },
  { type:'webtoon' },
  { type:'product' },
  { type:'phone', key:'phone', line:'결과가 준비되면<br>알려 드리겠습니다.', sub:'휴대폰 번호를 입력해 주세요. 알림톡 발송에만 사용합니다.', ph:'010-0000-0000' },
  { type:'delivery' },
  { type:'submit' },
  { type:'pay' },
];

/* ===== 유틸 ===== */
const $ = s => document.querySelector(s);
const view = $('#view');
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const DEFAULT_BG = 'assets/dosa.jpg';
let curBg = '';
function swapBg(src) {                      // 배경 이미지를 페이드로 교체
  if (src === curBg) return; curBg = src;
  const im = $('#bgimg'); im.style.opacity = 0;
  setTimeout(() => { im.src = src; im.style.opacity = .9; }, 220);
}
function setBg(mode, seal, src) {           // mode: true=강한 블러 | 'soft' | 'dim' | falsy=선명
  const bg = $('#bg');
  bg.classList.toggle('blur', mode === true); bg.classList.toggle('soft', mode === 'soft'); bg.classList.toggle('dim', mode === 'dim');
  swapBg(src || DEFAULT_BG);
  $('#seal').classList.toggle('hide', HAS_IMG || seal === false || mode === true);
}
function go(n, push = true) {
  if (push) history.push(idx);
  idx = n; render();
}
function next() { go(idx + 1); }
$('#back').onclick = () => { if (history.length) { idx = history.pop(); render(); } };

function stage(inner, st) {
  view.innerHTML = `<div class="stage fade">${st.eyebrow ? `<div class="eyebrow">${st.eyebrow}</div>` : '<div class="eyebrow"></div>'}
    <div class="line">${st.line || ''}${st.sub ? `<small>${st.sub}</small>` : ''}</div>${inner}</div>`;
}

/* ===== 렌더러 ===== */
function render() {
  const st = STEPS[idx];
  $('#progress').style.width = Math.round(idx / (STEPS.length - 1) * 100) + '%';
  $('#back').hidden = idx === 0 || ['loading', 'webtoon', 'submit', 'pay'].includes(st.type);
  setBg(st.blur, st.seal, st.bg);
  window.scrollTo(0, 0);
  R[st.type](st);
}

const R = {
  intro() {
    view.innerHTML = `<div class="center fade" id="introTap">
      <div class="hanja">金빛</div>
      <div class="t">금빛 사주명식<br>금빛도사의 방</div>
      <div class="s pulse">화면을 터치하세요</div></div>`;
    $('#introTap').onclick = next;
  },
  choice(st) {
    stage(st.opts.map((o, i) => `<button class="btn" data-i="${i}">${o}</button>`).join('') +
          (idx <= 2 ? `<button class="btn ghost" id="skip">이야기 건너뛰기 ›</button>` : ''), st);
    view.querySelectorAll('.btn[data-i]').forEach(b => b.onclick = next);
    const sk = $('#skip'); if (sk) sk.onclick = () => go(3);
  },
  radio(st) {
    stage(st.opts.map(o => `<button class="opt ${S[st.key] === o ? 'sel' : ''}" data-v="${esc(o)}">${o}</button>`).join(''), st);

      ${mobile ? `<a class="btn primary" href="${toss}" style="text-decoration:none;margin-top:14px">토스로 바로 송금하기</a>` : ''}
      <div class="box"><b>${mobile ? '다른 은행 앱으로 입금하시려면' : '입금 안내'}</b><br>${BANK.bank} ${BANK.no}<br>예금주 ${esc(BANK.holder)}
        <div class="row" style="margin-top:6px"><button class="chip" id="copyAcct">계좌번호 복사</button><button class="chip" id="copyAmt">금액 복사</button></div>
        <div style="margin-top:10px">입금자명은 위에 적어 주신 성함(<b>${esc(S.name)}</b>)과 같게 해 주시면 확인이 빨라집니다.</div></div>
      <div class="box">입금 확인 후 영업일 기준 몇 시간 ~ 1일 내외로 카카오톡·이메일로 보내 드립니다.<br>${KAKAO_NOTE}</div>
      <div class="disclaimer">본 리포트는 전통 명리학 이론을 바탕으로 한 참고용 콘텐츠이며, 의학적·법적·재정적 조언을 대체하지 않습니다.</div></div>`;
    const copy = (id, text, label) => { $(id).onclick = e => { navigator.clipboard && navigator.clipboard.writeText(text); e.target.textContent = '복사되었습니다'; setTimeout(() => e.target.textContent = label, 1500); }; };
    copy('#copyAcct', acct, '계좌번호 복사'); copy('#copyAmt', String(amount), '금액 복사');
  },
};

function fieldStep(st, type, ph, max, fmt, valid, msg) {
  stage(`<div class="field"><input id="in" type="${type === 'tel' ? 'tel' : type}" maxlength="${max || 50}" placeholder="${ph || ''}" value="${esc(S[st.key])}" autocomplete="off"><button class="ok" id="ok">확인</button></div><div class="err" id="err"></div>`, st);
  const inp = $('#in'), ok = $('#ok'); inp.focus();
  const upd = () => { if (fmt) inp.value = fmt(inp.value); ok.classList.toggle('on', inp.value.trim().length > 0); };
  inp.oninput = upd; upd();
  const submit = () => {
    const v = inp.value.trim();
    if (!v || (valid && !valid(v))) { $('#err').textContent = msg || '내용을 입력해 주세요.'; return; }
    S[st.key] = v; next();
  };
  ok.onclick = submit; inp.onkeydown = e => { if (e.key === 'Enter') submit(); };
}

/* 도사 이미지가 있으면 배경으로 사용 */
$('#bgimg').onload = () => { HAS_IMG = true; $('#seal').classList.add('hide'); };
render();
</script>
</body>
</html>
