<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#05030c">
<title>금빛도사 · 금빛 사주명식</title>
<meta name="description" content="금빛도사가 태어난 순간의 여덟 글자를 펼쳐 당신의 운명을 짚어 드립니다.">
<meta property="og:title" content="금빛도사 · 금빛 사주명식">
<meta property="og:description" content="질문 몇 개면 충분합니다. 금빛도사가 의표를 찌르는 풀이를 준비합니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700;900&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* =====================================================================
     금빛 사주명식 · 신청 폼 (판타지 개편)
     - 캐릭터(금빛도사) 이미지와 질문 흐름·검증·접수 로직은 그대로, 분위기만 환상적으로.
     - 색: 심야 보라(성운) + 금(금빛) 두 가지가 기본, 오행색은 마법진/로딩에서만 소량.
     ===================================================================== */
  :root {
    --void: #05030c; --gold: #d4af5a; --gold-soft: #f1dca0; --gold-hi: #fff3c4; --gold-dim: #8a7338; --gold-deep: #b8892c;
    --vio: #6c4bd6; --vio-hi: #9a7dff; --vio-pale: #cbbdff;
    --paper: #efe6cf; --line: rgba(212,175,90,.4); --glass: rgba(16,10,34,.7);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; color: var(--paper); font-family: 'Noto Sans KR', sans-serif; -webkit-text-size-adjust: 100%;
      background: radial-gradient(120% 80% at 50% 0%, #1b1044 0%, #07040f 55%, #020108 100%); }
  #app { position: relative; width: 100%; max-width: 480px; height: 100vh; height: 100dvh; margin: 0 auto; overflow: hidden; background: var(--void);
      box-shadow: 0 0 0 1px rgba(212,175,90,.16), 0 0 100px rgba(108,75,214,.32); }

  /* ---------- 배경 층: 성운(cosmos) → 캐릭터 일러스트(bg) → 색보정(tint) → 비네트 → 파티클(fx) ---------- */
  .cosmos { position: absolute; inset: 0; overflow: hidden; z-index: 0;
      background: radial-gradient(120% 70% at 50% -10%, #261556 0%, transparent 62%), linear-gradient(#0a0618, #05030c 55%, #0b0714); }
  .cosmos i { position: absolute; border-radius: 50%; animation: nebula 30s ease-in-out infinite alternate; animation-play-state: paused; }
  .cosmos.live i { animation-play-state: running; will-change: transform; }   /* 성운이 실제로 보일 때(웹툰·접수)만 움직인다 — 평소엔 그림에 가려져 있어 낭비 */
  .cosmos .a { width: 420px; height: 420px; left: -160px; top: 6%; background: radial-gradient(closest-side, rgba(98,64,214,.46), transparent); }
  .cosmos .b { width: 380px; height: 380px; right: -170px; top: 42%; background: radial-gradient(closest-side, rgba(214,150,50,.28), transparent); animation-duration: 38s; }
  .cosmos .c { width: 460px; height: 460px; left: -120px; bottom: -200px; background: radial-gradient(closest-side, rgba(70,40,170,.42), transparent); animation-duration: 46s; }
  @keyframes nebula { from { transform: translate3d(0,0,0); } to { transform: translate3d(34px,-46px,0); } }

  .bg { position: absolute; inset: 0; z-index: 1; transition: filter .6s ease, opacity .6s ease; }
  .bg img { width: 100%; height: 100%; object-fit: cover; object-position: center top; opacity: .92; transition: opacity .45s ease; transform-origin: 50% 28%; }
  .bg:not(.blur):not(.soft):not(.dim):not(.off) img { animation: kenburns 26s ease-in-out infinite alternate; }   /* 필터가 없을 때만 천천히 숨쉬는 카메라 */
  .bg.blur { filter: blur(9px) brightness(.78) saturate(1.15); }
  .bg.soft { filter: blur(3px) brightness(.7) saturate(1.08); }
  .bg.dim  { filter: brightness(.58) saturate(1.12); }
  .bg.off  { opacity: 0; }
  @keyframes kenburns { from { transform: scale(1); } to { transform: scale(1.07); } }

  .tint { position: absolute; inset: 0; z-index: 2; pointer-events: none;
      background: linear-gradient(180deg, rgba(70,36,160,.34) 0%, rgba(20,10,50,0) 40%, rgba(14,6,36,.42) 100%); }
  .vignette { position: absolute; inset: 0; z-index: 2; pointer-events: none;
      background: radial-gradient(120% 90% at 50% 38%, transparent 55%, rgba(2,1,8,.72) 100%),
                  linear-gradient(to bottom, rgba(2,1,8,.5) 0%, transparent 20%, transparent 45%, rgba(2,1,8,.9) 100%); }
  #fx { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; }

  .devflag { position: absolute; top: calc(8px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); z-index: 10; padding: 3px 12px; border-radius: 999px; pointer-events: none; white-space: nowrap;
      background: rgba(214,58,38,.94); color: #fff; font: 700 11px/1.5 'Noto Sans KR', sans-serif; letter-spacing: .04em; box-shadow: 0 2px 10px rgba(0,0,0,.5); }
  .progress { position: absolute; top: 0; left: 0; right: 0; height: 3px; z-index: 9; background: rgba(255,255,255,.06); }
  .progress i { display: block; position: relative; height: 100%; width: 0; background: linear-gradient(90deg, #5a3cc8, var(--gold) 72%, var(--gold-hi)); transition: width .5s ease; }
  .progress i::after { content: ''; position: absolute; right: -8px; top: 50%; width: 16px; height: 16px; transform: translateY(-50%);
      background: radial-gradient(circle, #fff8dc 0, rgba(255,214,120,.9) 28%, rgba(255,214,120,0) 70%); }
  .back { position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); left: 14px; z-index: 7; width: 38px; height: 38px; border-radius: 50%;
      border: 1px solid rgba(212,175,90,.5); background: rgba(10,6,24,.55); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
      color: var(--gold-soft); font-size: 22px; line-height: 1; display: grid; place-items: center; padding-bottom: 3px; cursor: pointer; }
  .back[hidden] { display: none; }

  /* ---------- 공통 장식 ---------- */
  .orn { position: relative; }
  .orn::after { content: ''; position: absolute; inset: -5px; pointer-events: none;
      background: var(--c1) 0 0/26px 26px no-repeat, var(--c2) 100% 0/26px 26px no-repeat, var(--c3) 100% 100%/26px 26px no-repeat, var(--c4) 0 100%/26px 26px no-repeat; }
  .foil { background: linear-gradient(180deg, #fff6d2 0%, #ecd07a 42%, #c79a38 72%, #f6e3a1 100%); -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent; }
  .foil.shimmer { background-size: 100% 240%; animation: foilmove 5.5s ease-in-out infinite; }
  @keyframes foilmove { 0%, 100% { background-position: 0 0; } 50% { background-position: 0 100%; } }
  .orn-div { display: block; width: 200px; height: 16px; margin: 20px auto; color: var(--gold); }
  .rune { width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 50%; display: grid; place-items: center; font-family: 'Noto Serif KR', serif; font-size: 30px; font-weight: 700; color: var(--gold-hi);
      background: radial-gradient(circle at 50% 35%, rgba(154,125,255,.5), rgba(20,10,50,.92) 72%); border: 1px solid var(--gold);
      box-shadow: 0 0 0 4px rgba(5,3,12,.85), 0 0 0 5px rgba(212,175,90,.5), 0 0 30px rgba(154,125,255,.6); }

  /* ---------- 마법진 (SVG 4겹: 겉고리·팔괘·오행별·중심) ---------- */
  .mcwrap { position: absolute; pointer-events: none; aspect-ratio: 1; }
  .mc { position: absolute; inset: 0; }
  .mcrot, .mccore { position: absolute; inset: 0; }
  .mcrot { will-change: transform; }
  .mc svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .mcwrap.paused .mc, .mcwrap.paused .mcrot, .mcwrap.paused .mccore { animation-play-state: paused; }   /* 화면 밖에서는 멈춰 배터리 절약 */
  .mcrot.r1 { animation: spin 110s linear infinite; }
  .mcrot.r2 { animation: spin 80s linear infinite reverse; }
  .mcrot.r3 { animation: spin 60s linear infinite; }
  .mccore { animation: corepulse 3.8s ease-in-out infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes breathe { 0%, 100% { opacity: .8; } 50% { opacity: 1; } }
  @keyframes corepulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }   /* 필터 애니메이션은 매 프레임 다시 그려 무거우므로 transform만 */
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes fadein { to { opacity: 1; } }
  .mc.draw .dr { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 2.8s cubic-bezier(.45,.05,.25,1) .3s forwards; }
  .mc.draw .fi { opacity: 0; animation: fadein 1.6s ease 1.5s forwards; }

  /* ---------- 질문 화면: 장면 설명 + 장식 대화창 + 선택지 ---------- */
  .stage { position: absolute; left: 0; right: 0; bottom: 0; max-height: 100%; overflow-y: auto; padding: 84px 18px calc(24px + var(--safe-b)); z-index: 4;
      background: linear-gradient(to top, rgba(3,2,9,.97) 0%, rgba(3,2,9,.92) 52%, transparent 100%); }
  .stage::-webkit-scrollbar { width: 0; }
  .eyebrow { display: flex; align-items: center; justify-content: center; gap: 8px; text-align: center; min-height: 18px; margin-bottom: 14px;
      font-family: 'Noto Serif KR', serif; font-size: 12.5px; letter-spacing: .1em; color: var(--gold-soft); opacity: .92; }
  .eyebrow span::before, .eyebrow span::after { content: '✦'; color: var(--gold); font-size: 9px; margin: 0 8px; vertical-align: 1px; }
  .dlg { position: relative; margin: 14px 4px 4px; padding: 26px 18px 16px; border-radius: 6px; border: 1px solid rgba(212,175,90,.6);
      background: linear-gradient(170deg, rgba(40,22,92,.66), rgba(8,5,20,.82));
      box-shadow: 0 0 0 1px rgba(0,0,0,.55), 0 0 0 5px rgba(212,175,90,.07), 0 14px 40px rgba(0,0,0,.6), inset 0 0 34px rgba(120,84,255,.16);
      -webkit-backdrop-filter: blur(9px); backdrop-filter: blur(9px); }
  .dlg::before { content: ''; position: absolute; inset: 5px; border: 1px solid rgba(212,175,90,.2); border-radius: 3px; pointer-events: none; }
  .nameplate { position: absolute; top: -15px; left: 16px; display: flex; align-items: center; gap: 7px; padding: 4px 15px 4px 5px; border-radius: 999px; z-index: 2;
      background: linear-gradient(180deg, #2c1a6e, #150b36); border: 1px solid rgba(212,175,90,.85); box-shadow: 0 0 16px rgba(154,125,255,.5);
      font-family: 'Noto Serif KR', serif; font-size: 12.5px; font-weight: 700; letter-spacing: .08em; color: var(--gold-soft); }
  .nameplate i { display: grid; place-items: center; width: 21px; height: 21px; border-radius: 50%; font-style: normal; font-size: 12px; font-weight: 900; color: #2a1d05;
      background: linear-gradient(180deg, #f6e3a1, #b8892c); }
  .line { font-family: 'Noto Serif KR', serif; font-size: 21px; line-height: 1.58; font-weight: 600; color: #fff7e0; word-break: keep-all; text-shadow: 0 2px 14px rgba(0,0,0,.7); }
  .line small { display: block; font-family: 'Noto Sans KR', sans-serif; font-size: 12.5px; font-weight: 400; color: var(--gold-soft); opacity: .82; margin-top: 8px; line-height: 1.55; text-shadow: none; }
  .ctl { margin: 6px 4px 0; }

  .btn, .opt { display: block; position: relative; overflow: hidden; width: 100%; text-align: center; padding: 15px 16px; margin-top: 10px; border-radius: 8px; cursor: pointer;
      border: 1px solid rgba(212,175,90,.44); background: linear-gradient(180deg, rgba(44,26,96,.58), rgba(12,8,28,.74)); color: #f6ecd2; font-size: 15px; font-family: inherit;
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); transition: transform .12s, border-color .2s, box-shadow .25s, background .25s; }
  .btn::before, .opt::before { content: ''; position: absolute; top: 0; bottom: 0; width: 38%; left: -60%; transform: skewX(-18deg); pointer-events: none;
      background: linear-gradient(105deg, transparent, rgba(255,236,170,.24), transparent); transition: left .7s ease; }
  @media (hover: hover) { .btn:hover::before, .opt:hover::before { left: 135%; } .btn:hover, .opt:hover { border-color: rgba(241,220,160,.8); } }
  .btn:active, .opt:active { transform: scale(.985); }
  .opt { text-align: left; padding-left: 38px; }
  .opt::after { content: ''; position: absolute; left: 16px; top: 50%; width: 8px; height: 8px; transform: translateY(-50%) rotate(45deg); border: 1px solid rgba(212,175,90,.7); background: transparent; transition: .2s; }
  .opt.sel { border-color: var(--gold-soft); background: linear-gradient(180deg, rgba(104,72,210,.5), rgba(30,16,70,.82)); box-shadow: 0 0 22px rgba(212,175,90,.35), inset 0 0 18px rgba(212,175,90,.12); }
  .opt.sel::after { background: var(--gold-hi); box-shadow: 0 0 10px var(--gold); }
  .opts.dense .opt { padding-top: 12px; padding-bottom: 12px; margin-top: 8px; }
  .btn.primary { color: #1a1405; font-weight: 700; border-color: #f0d588; text-shadow: 0 1px 0 rgba(255,255,255,.4);
      background: linear-gradient(180deg, #f3d584 0%, #d9ae4c 45%, #b8892c 100%); box-shadow: 0 0 22px rgba(212,175,90,.4), inset 0 1px 0 rgba(255,255,255,.55), inset 0 -3px 8px rgba(90,55,5,.35); }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--gold-soft); opacity: .8; font-size: 13px; padding: 10px; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
  .row { display: flex; gap: 10px; }
  .row .btn, .row .opt { margin-top: 10px; }

  .field { display: flex; gap: 10px; align-items: center; margin-top: 8px; padding: 4px 4px 6px 2px; border-bottom: 1px solid var(--line); position: relative; transition: border-color .25s, box-shadow .25s; }
  .field:focus-within { border-bottom-color: var(--gold-soft); box-shadow: 0 10px 22px -12px rgba(212,175,90,.6); }
  .field input, .field textarea { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: #fff; font-size: 20px; padding: 10px 2px; font-family: inherit; caret-color: var(--gold); }
  .field input::placeholder, .field textarea::placeholder { color: rgba(239,230,207,.35); }
  .field textarea { font-size: 16px; resize: none; height: 84px; }
  .chip { flex: none; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: rgba(16,10,34,.5); color: var(--gold-soft); font-size: 13px; cursor: pointer; font-family: inherit; transition: .2s; }
  .chip.on { background: linear-gradient(180deg, #f3d584, #c39a3c); color: #1a1405; border-color: #f0d588; font-weight: 700; box-shadow: 0 0 14px rgba(212,175,90,.45); }
  .ok { flex: none; padding: 10px 18px; border-radius: 999px; border: 0; font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer; background: rgba(255,255,255,.12); color: rgba(255,255,255,.4); transition: .25s; }
  .ok.on { background: linear-gradient(180deg, #f3d584, #c39a3c); color: #1a1405; box-shadow: 0 0 18px rgba(212,175,90,.55); }
  .err { color: #ff9c8a; font-size: 13px; margin-top: 8px; min-height: 18px; }

  /* ---------- 상품 선택: 주문서(스펠 카드) ---------- */
  .cards { max-height: 44vh; max-height: 44dvh; overflow-y: auto; margin: 4px -4px 0; padding: 2px 4px 18px; -webkit-overflow-scrolling: touch;
      -webkit-mask-image: linear-gradient(to bottom, #000 90%, transparent); mask-image: linear-gradient(to bottom, #000 90%, transparent); }
  .cards::-webkit-scrollbar { width: 0; }
  @property --a { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
  .card { position: relative; padding: 15px 16px 14px; margin-top: 12px; border-radius: 8px; cursor: pointer; border: 1px solid rgba(212,175,90,.42);
      background: linear-gradient(160deg, rgba(46,26,104,.6), rgba(10,6,24,.86)); box-shadow: inset 0 0 26px rgba(120,84,255,.14), 0 6px 20px rgba(0,0,0,.45); transition: border-color .2s, box-shadow .25s, transform .12s; }
  .card::before { content: ''; position: absolute; inset: 4px; border: 1px solid rgba(212,175,90,.16); border-radius: 5px; pointer-events: none; }
  .card:active { transform: scale(.99); }
  .card.sel { border-color: var(--gold-soft); box-shadow: 0 0 0 1px rgba(241,220,160,.5), 0 0 28px rgba(212,175,90,.5), inset 0 0 32px rgba(212,175,90,.16);
      background: linear-gradient(160deg, rgba(100,68,206,.55), rgba(24,14,52,.9)); }
  .card.sel::after { content: '✦ 선택'; position: absolute; top: -9px; right: 14px; padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .06em; color: #1a1405;
      background: linear-gradient(180deg, #f6e3a1, #c39a3c); box-shadow: 0 0 12px rgba(212,175,90,.6); }
  .card .n { font-family: 'Noto Serif KR', serif; font-size: 16.5px; font-weight: 700; color: #fff7e0; }
  .card .d { font-size: 12.5px; opacity: .78; margin-top: 4px; line-height: 1.45; }
  .event-banner { margin: 0 0 14px; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--gold-soft); background: linear-gradient(160deg, rgba(212,175,90,.18), rgba(24,14,52,.6)); text-align: center; font-size: 12.5px; line-height: 1.55; color: var(--gold-soft); }
  .event-banner b { display: block; font-family: 'Noto Serif KR', serif; font-size: 14px; color: #fff7e0; margin-bottom: 2px; }
  .card .p s.was { font-size: 12.5px; font-weight: 400; opacity: .6; margin-right: 4px; }
  .card .p s.was { -webkit-text-fill-color: rgba(255,247,224,.6); color: rgba(255,247,224,.6); }
  .card .p em.off, .card .p .off { -webkit-text-fill-color: #1a1405;  font-style: normal; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; margin-left: 4px; color: #1a1405; background: linear-gradient(180deg, #f6e3a1, #c39a3c); vertical-align: 2px; }
  .card .p { font-family: 'Noto Serif KR', serif; font-size: 17px; margin-top: 8px; font-weight: 700; }
  .card .wait { margin-top: 7px; font-size: 12px; font-weight: 700; color: var(--gold-soft); }
  .wait-note { margin: 0 0 14px; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--glass); font-size: 13px; line-height: 1.55; text-align: center; color: var(--gold-soft); }
  .card.hero { border: 2px solid transparent; padding-top: 16px; padding-bottom: 15px;
      background: linear-gradient(160deg, #241258, #0b0620) padding-box, conic-gradient(from var(--a), #f6e3a1, #9a7dff, #5fd3ff, #f6e3a1, #d4af5a, #f6e3a1) border-box;
      animation: holo 7s linear infinite; box-shadow: 0 0 26px rgba(154,125,255,.35), inset 0 0 28px rgba(120,84,255,.18); }
  .card.hero.sel { box-shadow: 0 0 34px rgba(255,214,120,.55), 0 0 18px rgba(154,125,255,.5), inset 0 0 34px rgba(212,175,90,.18); }
  @keyframes holo { to { --a: 360deg; } }
  .more-btn { display: block; width: 100%; margin: 16px 0 6px; padding: 14px 16px; text-align: center; cursor: pointer; border-radius: 8px; border: 1.5px solid var(--gold);
      background: linear-gradient(180deg, rgba(212,175,90,.22), rgba(212,175,90,.07)); color: #fff1c4; font-family: 'Noto Serif KR', serif; font-size: 16px; font-weight: 700; box-shadow: 0 0 20px rgba(212,175,90,.3); }
  .more-btn b { margin-left: 8px; color: var(--gold); }
  .more-btn small { display: block; margin-top: 4px; font-family: 'Noto Sans KR', sans-serif; font-size: 12px; font-weight: 400; color: rgba(255,241,196,.75); }
  .card.compact { padding: 11px 14px; }
  .card.compact .top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .card.compact .n { font-size: 14.5px; }
  .card.compact .p { margin-top: 0; font-size: 14px; }
  .card.compact .d { margin-top: 3px; font-size: 12px; }

  /* ---------- 로딩 · 접수중 ---------- */
  .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px; z-index: 4; }
  .center .t { font-family: 'Noto Serif KR', serif; font-size: 19px; margin-top: 26px; line-height: 1.6; color: #fff7e0; text-shadow: 0 0 20px rgba(154,125,255,.6); min-height: 31px; }
  .center .s { font-size: 13px; opacity: .75; margin-top: 12px; }
  .lc { position: relative; width: min(76vw, 310px); aspect-ratio: 1; flex: none; }
  .lc .mc { position: absolute; inset: 0; }
  .lc.done { animation: flash .9s ease-out both; }
  @keyframes flash { 0% { filter: brightness(1); transform: scale(1); } 40% { filter: brightness(2.1) drop-shadow(0 0 30px #ffd878); transform: scale(1.06); } 100% { filter: brightness(1.3); transform: scale(1.02); } }
  .tiles { display: flex; gap: 14px; margin-top: 26px; }

const DEFAULT_BG = 'assets/dosa_v2.jpg';

function setBg(mode, src) {                 // mode: true=강한 블러 | 'soft' | 'dim' | 'off'(숨김) | falsy=선명

function fieldStep(st, type, ph, max, fmt, valid, msg) {
  stage(`<div class="field"><input id="in" type="${type === 'tel' ? 'tel' : type}" maxlength="${max || 50}" placeholder="${ph || ''}" value="${esc(S[st.key])}" autocomplete="off"><button class="ok" id="ok">확인</button></div><div class="err" id="err"></div>`, st);
  const inp = $('#in'), ok = $('#ok'); inp.focus();
  const upd = () => { if (fmt) inp.value = fmt(inp.value); ok.classList.toggle('on', inp.value.trim().length > 0); };
  inp.oninput = upd; upd();
  const submit = () => {
    const v = inp.value.trim();
    if (!v || (valid && !valid(v))) { $('#err').textContent = msg || '내용을 입력해 주세요.'; return; }
    S[st.key] = v; next();
  };
  ok.onclick = submit; inp.onkeydown = e => { if (e.key === 'Enter') submit(); };
}

/* PDF 샘플 갤러리: 가운데에 온 카드를 키우고(점 표시), 누르면 크게 보기 */
function pdfGallery(root) {
  const tr = root.querySelector('#pdfTrack'); if (!tr) return;
  const cards = [...tr.querySelectorAll('.pdfx-card')], dots = [...root.querySelectorAll('#pdfDots i')];
  const mark = () => {
    const c = tr.scrollLeft + tr.clientWidth / 2; let best = 0, bd = 1e9;
    cards.forEach((el, i) => { const d = Math.abs(el.offsetLeft + el.offsetWidth / 2 - c); if (d < bd) { bd = d; best = i; } });
    cards.forEach((el, i) => el.classList.toggle('on', i === best)); dots.forEach((el, i) => el.classList.toggle('on', i === best));
  };
  tr.addEventListener('scroll', () => requestAnimationFrame(mark), { passive: true });
  cards.forEach((el, i) => el.onclick = () => {
    if (el.classList.contains('on')) openShot(i);
    else tr.scrollTo({ left: el.offsetLeft + el.offsetWidth / 2 - tr.clientWidth / 2, behavior: 'smooth' });
  });
  mark();
}
function openShot(i) {
  const s = PDF_SHOTS[i]; closeShot();
  const lb = document.createElement('div'); lb.className = 'lb fade';
  lb.innerHTML = `<button class="lb-x" aria-label="닫기">✕</button><div class="lb-body"><img src="assets/${s.f}" alt="${s.t}"><div class="lb-cap">${s.t} (샘플)</div></div>`;
  lb.onclick = e => { if (e.target === lb || e.target.classList.contains('lb-x') || e.target.classList.contains('lb-body')) closeShot(); };
  $('#app').appendChild(lb);
}
const closeShot = () => document.querySelectorAll('.lb').forEach(e => e.remove());
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeShot(); });

/* 웹툰 그림에 은은한 시차(스크롤 깊이감): 화면에 보이는 그림만 갱신 */
function parallax(root) {
  const items = [...root.querySelectorAll('.pic.im')].map(el => ({ el, img: el.querySelector('img'), vis: false }));
  const io = new IntersectionObserver(es => es.forEach(e => { const it = items.find(i => i.el === e.target); if (it) it.vis = e.isIntersecting; }), { root, threshold: 0 });
  items.forEach(i => io.observe(i.el));
  let ticking = false;
  const upd = () => {
    ticking = false;
    const rr = root.getBoundingClientRect(), mid = rr.top + rr.height / 2;
    items.forEach(i => { if (!i.vis) return; const r = i.el.getBoundingClientRect(); i.img.style.setProperty('--py', (-((r.top + r.height / 2) - mid) * .05).toFixed(1) + 'px'); });
  };
  root.addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(upd); } }, { passive: true });
  requestAnimationFrame(upd);
}
